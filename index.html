<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #33ff33;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            text-align: center;
            opacity: 0;
            border: 4px solid #33ff33;
            padding: 60px 80px;
            box-shadow: 0 0 20px #33ff33, inset 0 0 20px rgba(51, 255, 51, 0.1);
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #33ff33, 0 0 20px #33ff33;
        }

        p {
            font-size: 0.9rem;
            color: #00cc00;
            letter-spacing: 2px;
            transition: color 0.2s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            border: 2px solid #33ff33;
            background-color: transparent;
            color: inherit;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .theme-toggle:focus-visible {
            outline: 2px solid #33ff33;
            outline-offset: 3px;
        }

        body.light-mode {
            background-color: #f6f6f6;
            color: #146314;
        }

        body.light-mode .container {
            border-color: #146314;
            box-shadow: 0 0 20px #146314, inset 0 0 20px rgba(20, 99, 20, 0.12);
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.2) 0px,
                rgba(255, 255, 255, 0.2) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        body.light-mode h1 {
            text-shadow: 0 0 10px #146314, 0 0 20px #146314;
        }

        body.light-mode p {
            color: #1f7f1f;
        }

        body.light-mode .theme-toggle {
            border-color: #146314;
        }

        body.light-mode .theme-toggle:focus-visible {
            outline-color: #146314;
        }

        .blink {
            animation: blink-animation 1s steps(2, start) infinite;
        }

        @keyframes blink-animation {
            to { visibility: hidden; }
        }
    </style>
</head>
<body>
    <button type="button" class="theme-toggle" aria-label="Toggle dark and light mode">LIGHT MODE</button>
    <div class="container">
        <h1>HELLO WORLD</h1>
        <p>Welcome to the retro web <span class="blink">_</span></p>
    </div>

    <script>
        (function () {
            const themeStorageKey = 'themePreference';
            const body = document.body;
            const container = document.querySelector('.container');
            const themeToggle = document.querySelector('.theme-toggle');
            const setTheme = (theme) => {
                const isLight = theme === 'light';
                body.classList.toggle('light-mode', isLight);
                themeToggle.textContent = isLight ? 'DARK MODE' : 'LIGHT MODE';
            };

            const savedTheme = localStorage.getItem(themeStorageKey);
            setTheme(savedTheme === 'light' ? 'light' : 'dark');

            themeToggle.addEventListener('click', () => {
                const nextTheme = body.classList.contains('light-mode') ? 'dark' : 'light';
                setTheme(nextTheme);
                localStorage.setItem(themeStorageKey, nextTheme);
            });

            let opacity = 0;
            const fadeIn = setInterval(() => {
                opacity += 0.02;
                container.style.opacity = opacity;
                if (opacity >= 1) {
                    clearInterval(fadeIn);
                    container.style.opacity = 1;
                }
            }, 30);
        })();
    </script>
</body>
</html>
